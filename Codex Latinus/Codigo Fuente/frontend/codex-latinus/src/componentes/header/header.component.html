<nav
  class="header-fijo navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary shadow-sm"
>
  <div class="container-fluid d-flex align-items-center flex-wrap gap-2">

    <div class="d-flex align-items-center flex-wrap gap-2">
      <a class="navbar-brand d-flex align-items-center m-0" href="#">
        <span class="text-white fw-bold">
          CODEX <span class="text-info">LATINUS</span>
        </span>
      </a>

      <input
        type="file"
        #fileInput
        accept=".lat"
        style="display: none"
        (change)="onArchivoSeleccionado($event)"
      />

      <button
        class="btn btn-outline-light btn-sm fw-bold"
        (click)="fileInput.click()"
      >
        <i class="bi bi-folder2-open me-1"></i> Abrir archivo .lat
      </button>

      @if (sePuedeTraducir) {
      <button
        class="btn btn-primary btn-sm fw-bold shadow-sm"
        (click)="verTraduccion()"
      >
        <i class="bi bi-translate me-1"></i> Traducir a Pig Latin
      </button>
      }

      <button class="btn btn-success btn-sm fw-bold" (click)="descargar()">
        <i class="bi bi-download me-1"></i> Descargar
      </button>
    </div>

    <div class="d-flex justify-content-center flex-grow-1">
      <button class="btn btn-info btn-sm fw-bold" (click)="ejecutar()">
        <i class="bi bi-play-fill me-1"></i> EJECUTAR
      </button>
    </div>

    <div style="min-width: 1px;"></div>

  </div>
</nav>
<br />
